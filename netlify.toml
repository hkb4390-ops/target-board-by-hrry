[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API proxy (must stay above the SPA fallback)
[[redirects]]
  from = "/tbapi/*"
  to = "/.netlify/functions/tbapi"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
